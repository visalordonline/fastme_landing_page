<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Professional QR Code Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #172033;
      background:
        radial-gradient(circle at 10% 10%, rgba(84, 125, 255, 0.1), transparent 30rem),
        #f4f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
    }

    .card {
      background: #fff;
      width: min(100%, 520px);
      padding: 36px;
      border: 1px solid #e8ebf3;
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(31, 44, 80, 0.1);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #5269d8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #172033;
      font-size: clamp(26px, 5vw, 34px);
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 10px 0 28px;
      color: #68738a;
      font-size: 15px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #263149;
      font-size: 14px;
      font-weight: 650;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 14px 15px;
      border: 1px solid #dce1ec;
      border-radius: 10px;
      background: #fcfdff;
      color: #172033;
      font-size: 15px;
      resize: vertical;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    textarea:focus,
    input[type="file"]:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: none;
      border-color: #5269d8;
      box-shadow: 0 0 0 3px rgba(82, 105, 216, 0.16);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #929bad;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .divider::before,
    .divider::after {
      height: 1px;
      flex: 1;
      background: #e9ecf3;
      content: "";
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px dashed #cbd2e2;
      border-radius: 10px;
      background: #fafbfe;
      color: #59657b;
      font-size: 13px;
    }

    input[type="file"]::file-selector-button {
      margin-right: 12px;
      padding: 8px 11px;
      border: 0;
      border-radius: 7px;
      background: #e9edff;
      color: #4056c4;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      background: #4059d6;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 650;
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover {
      background: #3349bd;
      transform: translateY(-1px);
    }

    .uploads-link {
      display: block;
      margin-top: 15px;
      color: #4059d6;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .uploads-link:hover {
      text-decoration: underline;
    }

    .loader {
      margin-top: 14px;
      color: #5269d8;
      font-size: 14px;
      text-align: center;
    }

    #qrCode {
      width: fit-content;
      max-width: 100%;
      margin: 24px auto 0;
      padding: 14px;
      border: 1px solid #e9ecf3;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(31, 44, 80, 0.08);
    }

    #qrCode:empty {
      display: none;
    }

    #qrCode img,
    #qrCode canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .pricing {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid #edf0f5;
    }

    .price-option {
      padding: 14px;
      border: 1px solid #e8ebf3;
      border-radius: 12px;
      background: #fafbfe;
    }

    .price-option strong {
      display: block;
      margin-bottom: 4px;
      color: #202b42;
      font-size: 19px;
    }

    .price-option span {
      color: #737e92;
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      .card {
        padding: 26px 20px;
      }

      .pricing {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <p class="eyebrow">Document sharing</p>
    <h1>QR Code Generator</h1>
    <p class="intro">Create a QR code from your text or an image and make it easy to share.</p>

    <label for="textInput">Text or document details</label>
    <textarea id="textInput" placeholder="Enter text or structured information...&#10;Example:&#10;Name: Gentle Saviour&#10;DOB: 12/12/1990&#10;Marital Status: Single"></textarea>

    <div class="divider" aria-hidden="true">OR</div>

    <input type="file" id="imageInput" accept="image/*">

    <button id="generateBtn">Generate QR Code</button>
    <a class="uploads-link" href="uploaded.html">View uploaded documents</a>

    <div class="loader" id="loader" style="display:none;" role="status" aria-live="polite">Uploading image...</div>

    <div id="qrCode"></div>
    <div class="pricing" aria-label="Pricing">
      <div class="price-option">
        <strong>$18</strong>
        <span>Per document / month</span>
      </div>
      <div class="price-option">
        <strong>$12</strong>
        <span>Per document / 2 weeks</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ================== YOUR FIREBASE CONFIG ==================
    const firebaseConfig = {
      apiKey: "AIzaSyCDfyVAhNfuXYyzeetQ1_wlFhz7-wXWHDk",
      authDomain: "treasure-f5cc7.firebaseapp.com",
      databaseURL: "https://treasure-f5cc7-default-rtdb.firebaseio.com",
      projectId: "treasure-f5cc7",
      storageBucket: "treasure-f5cc7.firebasestorage.app",
      messagingSenderId: "726318121382",
      appId: "1:726318121382:web:3cf5c5c7e628c9e313cf67"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CLOUD_NAME = "lx1inmam";
    const UPLOAD_PRESET = "scandocument";

    function generateQR(value) {
      const qrContainer = document.getElementById("qrCode");
      qrContainer.innerHTML = "";

      new QRCode(qrContainer, {
        text: value,
        width: 260,
        height: 260,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

   async function saveToFirebase(url, type, publicId = null) {
  try {
    await push(ref(db, "uploads"), {
      url: url,
      type: type,
      public_id: publicId,
      timestamp: new Date().toISOString()
    });
  } catch (err) {
    console.error("Firebase Save Error:", err);
  }
}

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        { method: "POST", body: formData }
      );
      
      if (!response.ok) throw new Error("Upload Failed");
      const data = await response.json();
      return {
        secure_url: data.secure_url,
        public_id: data.public_id
      };
    }

    // Main Generate Function
    async function handleGenerate() {
      const textArea = document.getElementById("textInput");
      const imageFile = document.getElementById("imageInput").files[0];
      const loader = document.getElementById("loader");

      const text = textArea.value.trim();

      if (text) {
        generateQR(text);
        await saveToFirebase(text, 'text');
        return;
      }

      if (imageFile) {
        loader.style.display = "block";
        try {
         const cloudinaryData = await uploadToCloudinary(imageFile);

        loader.style.display = "none";

        generateQR(cloudinaryData.secure_url);

        await saveToFirebase(
          cloudinaryData.secure_url,
          'image',
          cloudinaryData.public_id
        );
        } catch (err) {
          loader.style.display = "none";
          alert("Upload failed: " + err.message);
        }
        return;
      }

      alert("Please enter some text or upload an image");
    }

    // Attach button click using event listener (Best practice with modules)
    document.getElementById("generateBtn").addEventListener("click", handleGenerate);
  </script>
</body>
</html>
